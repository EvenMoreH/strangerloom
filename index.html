<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Strangerloom</title>
		<meta name="description" content="NPC and party generator for tabletop role-playing games." />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1c1917" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-title" content="Strangerloom" />
		<meta name="mobile-web-app-capable" content="yes" />
		<link rel="icon" href="favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="favicon.ico" sizes="16x16 32x32" />
		<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48" />
		<link rel="apple-touch-icon" href="apple-touch-icon.png" />
		<script>
			// Apply the stored theme before the first paint. The ids are the themes of src/engine/themes.ts.
			// Inside a frame the embedder's theme wins while following is on (`followEmbed` in the prefs, default
			// on): `?embed-theme=<id>` in the address, kept in sessionStorage for later loads of the frame. The rule
			// is the one of src/engine/embed.ts.
			(function () {
				var themes =
					/^(light|paper|parchment|sepia|frost|lilac|contrast|dark|graphite|midnight|candlelight|horror|cyberpunk|terminal)$/;
				var prefs = {};
				try {
					prefs = JSON.parse(localStorage.getItem('strangerloom.prefs') || '{}') || {};
				} catch (e) {}
				var theme = prefs.theme;
				try {
					if (window.self !== window.top) {
						var sent = new URLSearchParams(location.search).get('embed-theme');
						if (themes.test(sent)) {
							try {
								sessionStorage.setItem('strangerloom.embedTheme', sent);
							} catch (e) {}
						} else {
							sent = sessionStorage.getItem('strangerloom.embedTheme');
						}
						if (prefs.followEmbed !== false && themes.test(sent)) theme = sent;
					}
				} catch (e) {}
				if (themes.test(theme)) {
					document.documentElement.setAttribute('data-theme', theme);
				}
			})();
		</script>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<div id="app"></div>
	</body>
</html>
